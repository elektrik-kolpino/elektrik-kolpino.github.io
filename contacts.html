        nav { display: flex; gap: 20px; align-items: center; }

        nav a:hover, nav a.active { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .neon-phone {
            font-weight: 900; font-size: 20px; text-decoration: none; padding: 8px 16px; border-radius: 4px; border: 2px solid transparent;
            background: linear-gradient(#141418, #141418) padding-box, linear-gradient(90deg, #ff007f, #00f3ff, #ff007f) border-box;
            animation: rainbow-text 3s linear infinite;
        }
        @keyframes rainbow-text {
            0% { color: #ff007f; text-shadow: 0 0 10px rgba(255,0,127,0.8); filter: hue-rotate(0deg); }
            100% { color: #ff007f; text-shadow: 0 0 10px rgba(255,0,127,0.8); filter: hue-rotate(360deg); }
        }
        .page-title { padding: 40px 0 10px 0; text-align: center; font-size: 36px; font-weight: 900; text-transform: uppercase; }
        .contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
        .contact-box { background-color: var(--card-bg); border: 1px solid #22222b; padding: 30px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .contact-box h2 { text-transform: uppercase; font-size: 20px; margin-bottom: 20px; border-left: 4px solid var(--neon-pink); padding-left: 15px; }
        .contact-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-decoration: none; color: #fff; padding: 15px; background: #0b0b0d; border: 1px solid #1f1f28; border-radius: 4px; }
        .c-icon { font-size: 24px; color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); width: 35px; text-align: center; }
        .c-info p { font-size: 18px; font-weight: 700; }
        .geo-title { color: var(--neon-cyan); font-weight: 700; text-transform: uppercase; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .geo-list { color: var(--text-muted); font-size: 14px; line-height: 1.8; }
        .geo-list p { margin-bottom: 8px; border-bottom: 1px solid #1c1c24; padding-bottom: 4px; }
        .messenger-block { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 25px; padding: 20px; background: #141418; border: 2px dashed #ff007f; border-radius: 4px; }
        .btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 35px; font-size: 18px; font-weight: 900; text-transform: uppercase; text-decoration: none; border-radius: 4px; }
        .btn-wa { border: 2px solid #25D366; color: #fff; }
        .btn-tg { border: 2px solid #0088cc; color: #fff; }
        .sticky-mobile-action { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 11, 13, 0.95); border-top: 2px solid var(--neon-pink); padding: 12px 20px; z-index: 999; }
        .sticky-mobile-action .btn-sticky { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background-color: var(--neon-pink); color: #fff; text-decoration: none; padding: 14px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        footer { background-color: #060608; padding: 30px 0; border-top: 1px solid #1b1b22; text-align: center; color: var(--text-muted); font-size: 14px; }
        @media (max-width: 992px) { .contact-layout { grid-template-columns: 1fr; } }
        @media (max-width: 768px) {

            .sticky-mobile-action { display: block; }
        }
