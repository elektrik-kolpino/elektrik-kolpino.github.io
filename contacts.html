<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты электрика в Колпино — Вызвать мастера на дом</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111111; --card-bg: #1c1c1c; --text-main: #ffffff; --text-muted: #959595;
            --neon-pink: #ff007f; --neon-glow: rgba(255, 0, 127, 0.6); --neon-cyan: #00f3ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Montserrat', sans-serif; line-height: 1.6; padding-bottom: 80px; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header { background-color: rgba(17, 17, 17, 0.95); border-bottom: 1px solid #2c2c2c; position: sticky; top: 0; z-index: 100; padding: 15px 0; }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-weight: 900; font-size: 24px; text-transform: uppercase; text-decoration: none; color: #fff; }
        .logo span { text-shadow: 0 0 10px var(--neon-cyan); }
        nav { display: flex; gap: 20px; }
        nav a { color: var(--text-main); text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 14px; transition: 0.3s; padding: 5px 0; }
        nav a:hover, nav a.active { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        .page-title { padding: 60px 0 20px 0; text-align: center; font-size: 36px; font-weight: 900; text-transform: uppercase; }
        .page-title span { text-shadow: 0 0 15px var(--neon-pink); }
        .contact-wrap { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 40px auto; }
        .contact-item { background: var(--card-bg); border: 1px solid #2c2c2c; padding: 25px; border-radius: 4px; display: flex; align-items: center; gap: 20px; text-decoration: none; color: #fff; transition: 0.3s; }
        .contact-item:hover { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255,0,127,0.2); }
        .c-icon { font-size: 30px; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); width: 50px; text-align: center; }
        .c-info h3 { text-transform: uppercase; font-size: 14px; color: var(--text-muted); margin-bottom: 5px; }
        .c-info p { font-size: 20px; font-weight: 700; }
        .c-info span { color: var(--neon-cyan); }
        .sticky-mobile-action { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(17, 17, 17, 0.95); border-top: 1px solid var(--neon-pink); padding: 12px 20px; z-index: 999; }
        .sticky-mobile-action .btn-sticky { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background-color: var(--neon-pink); color: #fff; text-decoration: none; padding: 14px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        footer { background-color: #0a0a0a; padding: 40px 0; border-top: 1px solid #2c2c2c; text-align: center; color: var(--text-muted); font-size: 14px; }
        @media (max-width: 768px) {
            body { padding-bottom: 90px; } .header-wrap { flex-direction: column; text-align: center; }
            nav { width: 100%; justify-content: center; flex-wrap: wrap; } .sticky-mobile-action { display: block; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo"><span>КОЛПИНО</span> ЭЛЕКТРИК<span class="logo-dot">.</span></a>
            <nav>
                <a href="index.html">Главная</a>
                <a href="services.html">Услуги</a>
                <a href="prices.html">Цены</a>
                <a href="contacts.html" class="active">Контакты</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Связаться с <span>Мастером</span></h1>
        
        <div class="contact-wrap">
            <a href="tel:+79500308830" class="contact-item">
                <div class="c-icon"><i class="fa-solid fa-phone-volume"></i></div>
                <div class="c-info"><h3>Телефон для вызова</h3><p>+7 (950) 030-88-30</p></div>
            </a>
            <a href="https://t.me" target="_blank" class="contact-item">
                <div class="c-icon"><i class="fa-brands fa-telegram"></i></div>
                <div class="c-info"><h3>Написать в Telegram</h3><p>@elektrikkolpino</p></div>
            </a>
            <a href="https://wa.me" target="_blank" class="contact-item">
                <div class="c-icon"><i class="fa-brands fa-whatsapp"></i></div>
                <div class="c-info"><h3>Связаться в WhatsApp</h3><p>+7 (950) 030-88-30</p></div>
            </a>
            <div class="contact-item" style="cursor: default;">
                <div class="c-icon"><i class="fa-solid fa-location-dot"></i></div>
                <div class="c-info"><h3>Район обслуживания</h3><p>г. Колпино <span>&</span> Колпинский район СПб</p></div>
            </div>
        </div>
    </div>

    <div class="sticky-mobile-action"><a href="tel:+79500308830" class="btn-sticky"><i class="fa-solid fa-phone-flip"></i> Позвонить прямо сейчас</a></div>
    <footer><div class="container"><p>Электрик-Колпино © 2026.</p></div></footer>
</body>
</html>
